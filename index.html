    function cleanDriveLink(rawUrl, driveUrl, driveFileId) {
      let s = String(rawUrl || "").trim();
      s = s.replace(/\[https?:\/\/[^\]]+\]\((https?:\/\/[^\)]+)\)/g, "$1").replace(/^\[|\]$/g, "");
      if (s.startsWith("data:")) return s;

      const combined = s + " " + String(driveUrl || "") + " " + String(driveFileId || "");
      const m = combined.match(/(?:id=|\/d\/|^|\s)([a-zA-Z0-9_-]{25,})/);
      if (m && m[1]) {
        return "https://drive.google.com/uc?export=download&id=" + m[1];
      }
      return s;
    }

    const driveAudioCache = new Map();

    function setupDriveAudioAutoLoader(gasWebhookUrl) {
      if (!gasWebhookUrl || !gasWebhookUrl.startsWith("http")) return;

      let activeDownloads = 0;
      const queue = [];

      function processQueue() {
        while (activeDownloads < 2 && queue.length > 0) {
          const nextAudioEl = queue.shift();
          runResolve(nextAudioEl);
        }
      }

      async function runResolve(audioEl) {
        if (!audioEl || audioEl.dataset.driveResolved === "true" || audioEl.dataset.driveLoading === "true") return;
        const src = audioEl.getAttribute("src") || audioEl.src || "";
        const match = src.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]{25,})/);
        if (!match || !match[1]) return;

        const fileId = match[1];
        if (driveAudioCache.has(fileId)) {
          audioEl.dataset.driveResolved = "true";
          audioEl.src = driveAudioCache.get(fileId);
          return;
        }

        audioEl.dataset.driveLoading = "true";
        activeDownloads++;
        try {
          const res = await fetch(gasWebhookUrl + "?action=getAudio&id=" + encodeURIComponent(fileId));
          const data = await res.json();
          if (data && data.status === "ok" && data.dataUrl) {
            driveAudioCache.set(fileId, data.dataUrl);
            audioEl.dataset.driveResolved = "true";
            const wasPlaying = !audioEl.paused;
            audioEl.src = data.dataUrl;
            audioEl.load();
            if (wasPlaying) audioEl.play().catch(() => {});
          }
        } catch (err) {
          console.warn("Gagal memuat audio dari Drive:", err);
        } finally {
          audioEl.dataset.driveLoading = "false";
          activeDownloads--;
          processQueue();
        }
      }

      function enqueueAudio(el, priority = false) {
        if (!el || el.dataset.driveResolved === "true" || el.dataset.driveLoading === "true") return;
        if (!queue.includes(el)) {
          if (priority) queue.unshift(el);
          else queue.push(el);
        }
        processQueue();
      }

      const scanAllAudios = () => {
        document.querySelectorAll("audio").forEach(el => {
          const src = el.getAttribute("src") || el.src || "";
          if (src.includes("drive.google.com") || src.includes("docs.google.com")) {
            if (!el.dataset.listenerAttached) {
              el.dataset.listenerAttached = "true";
              const parentBox = el.parentElement || el;
              parentBox.addEventListener("mouseenter", () => enqueueAudio(el, true), { once: true });
              parentBox.addEventListener("touchstart", () => enqueueAudio(el, true), { once: true, passive: true });
              el.addEventListener("play", () => enqueueAudio(el, true));
            }
            enqueueAudio(el, false);
          }
        });
      };

      const observer = new MutationObserver(() => scanAllAudios());
      observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["src"] });
      setInterval(scanAllAudios, 1500);
    }

          if (cloudData.config.enabledPages && cloudData.config.enabledPages[8] === undefined) {

          localStorage.setItem("ETAHFIZ_WHITELABEL_CONFIG_V1", JSON.stringify(cloudData.config));
          if (typeof document !== 'undefined') {
            document.body.classList.toggle('hide-password-hints', Boolean(cloudData.config.hidePasswordHints));
            document.title = (cloudData.config.programTitle || 'E-Tahfiz') + ' - ' + cloudData.config.schoolName;
          }
          hasUpdates = true;
        }
        if (Array.isArray(cloudData.records)) {
          const sanitizedRecords = cloudData.records.map(r => ({
            ...r,
            audioUrl: cleanDriveLink(r.audioUrl, r.driveUrl, r.driveFileId)
          }));
          localStorage.setItem("ETAHFIZ_COMMERCIAL_RECORDS_V1", JSON.stringify(sanitizedRecords));
          hasUpdates = true;
        }

        if (hasUpdates) {
          window.dispatchEvent(new CustomEvent("etahfiz-cloud-synced", { detail: cloudData }));
        }
      } catch (cloudErr) {
        console.warn("Sinkronisasi latar belakang ditunda (Offline/Lokal):", cloudErr);
      }
    }

function extractYouTubeEmbedUrl(rawUrl) {
  const s = String(rawUrl || "").trim();
  if (!s) return "";
  if (s.includes("youtube.com/embed/")) return s;
  let videoId = "";
  if (s.includes("youtu.be/")) {
    videoId = s.split("youtu.be/")[1].split("?")[0].split("&")[0].split("/")[0];
  } else if (s.includes("watch?v=")) {
    videoId = s.split("watch?v=")[1].split("&")[0].split("#")[0];
  } else if (s.includes("/shorts/")) {
    videoId = s.split("/shorts/")[1].split("?")[0].split("/")[0];
  } else if (s.includes("/live/")) {
    videoId = s.split("/live/")[1].split("?")[0].split("/")[0];
  }
  if (videoId && videoId.length === 11) {
    return "https://www.youtube.com/embed/" + videoId + "?rel=0&modestbranding=1";
  }
  return s;
}

  // State Perekaman Suara
  const [isRecording, setIsRecording] = useState(false);
  const [recordingSeconds, setRecordingSeconds] = useState(0);
  const [recordedAudioUrl, setRecordedAudioUrl] = useState(null);
  const [isUploading, setIsUploading] = useState(false);
  const [waveBars, setWaveBars] = useState(Array(20).fill(18));

  const mediaRecorderRef = useRef(null);
  const audioChunksRef = useRef([]);
  const timerRef = useRef(null);

  const handleJuzChange = (newJuz) => {
    const j = Number(newJuz);
    setSelectedJuz(j);
    const firstSurah = SURAHS_DATA.find(s => s.juz === j);
    if (firstSurah) {
      setSelectedSurahNum(firstSurah.number);
      const startA = firstSurah.juzAyatStart || 1;
      const endA = firstSurah.juzAyatEnd || firstSurah.ayat;
      setAyatStart(startA);
      setAyatEnd(Math.min(startA + 9, endA));
    }
  };

  const handleSurahChange = (surahNum) => {
    const sNum = Number(surahNum);
    setSelectedSurahNum(sNum);
    const sObj = SURAHS_DATA.find(s => s.juz === Number(selectedJuz) && s.number === sNum) || SURAHS_DATA.find(s => s.number === sNum);
    if (sObj) {
      const startA = sObj.juzAyatStart || 1;
      const endA = sObj.juzAyatEnd || sObj.ayat;
      setAyatStart(startA);
      setAyatEnd(Math.min(startA + 9, endA));
    }
  };

  const handleConfirmStudent = (e) => {
    e.preventDefault();
    const std = students.find(s => s.id === selectedStudentId);
    if (std) {
      setConfirmedStudent(std);
      setRecordedAudioUrl(null);
      setRecordingSeconds(0);
      showToast("Murid " + std.name + " (" + std.kelas + ") dipilih. Silakan pilih Juz (1-30), Surat & mulai merekam.");
    }
  };

  useEffect(() => {
    if (isRecording) {
      timerRef.current = setInterval(() => {
        setRecordingSeconds(prev => prev + 1);
        setWaveBars(Array.from({ length: 20 }, () => Math.floor(Math.random() * 75) + 15));
      }, 1000);
    } else {
      clearInterval(timerRef.current);
      setWaveBars(Array(20).fill(18));
    }
    return () => clearInterval(timerRef.current);
  }, [isRecording]);

  const formatDuration = (sec) => {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return m + ":" + s;
  };

  const startRecording = async () => {
    setRecordedAudioUrl(null);
    setRecordingSeconds(0);
    audioChunksRef.current = [];

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus'
          : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
        const mediaRecorder = mime
          ? new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 32000 })
          : new MediaRecorder(stream);
        mediaRecorderRef.current = mediaRecorder;

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            audioChunksRef.current.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(track => track.stop());
          if (audioChunksRef.current.length > 0) {
            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
            const audioBlob = new Blob(audioChunksRef.current, { type: mimeType });
            const reader = new FileReader();
            reader.onloadend = () => {
              if (typeof reader.result === 'string') setRecordedAudioUrl(reader.result);
            };
            reader.readAsDataURL(audioBlob);
          } else {
            const simUrl = generateSimulatedMurottalWav(5, category);
            setRecordedAudioUrl(simUrl);
          }
        };

        mediaRecorder.start();
        setIsRecording(true);
        showToast("Perekaman suara dimulai... Silakan lantunkan ayat Al-Qur'an.");
        return;
      } catch (err) {}
    }

    mediaRecorderRef.current = null;
    setIsRecording(true);
    showToast("Mode Perekaman Aktif (Simulasi Audio Otomatis). Silakan lantunkan bacaan Anda.");
  };

  const stopRecording = () => {
    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
      mediaRecorderRef.current.stop();
    } else {
      const simUrl = generateSimulatedMurottalWav(Math.max(4, Math.min(recordingSeconds || 5, 10)), category);
      setRecordedAudioUrl(simUrl);
    }
    setIsRecording(false);
    showToast("Perekaman selesai! Silakan putar ulang atau simpan ke Google Drive & Spreadsheet.");
  };

  const handleSaveToDriveAndSheet = () => {
    if (!confirmedStudent) {
      showToast("Pilih nama murid dan klik OK terlebih dahulu!", "error");
      return;
    }
    if (!recordedAudioUrl) {
      showToast("Silakan lakukan perekaman suara terlebih dahulu!", "error");
      return;
    }

    const start = Math.max(1, Number(ayatStart) || 1);
    const end = Math.max(start, Math.min(currentSurah.ayat, Number(ayatEnd) || start));

    setIsUploading(true);
    setTimeout(() => {
      const now = new Date();
      const timestampStr = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0') + "-" + String(now.getDate()).padStart(2, '0') + " " + String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0') + " WIB";
      const cleanName = confirmedStudent.name.replace(/[^a-zA-Z]/g, '');
      const cleanSurah = currentSurah.name.replace(/[^a-zA-Z]/g, '');
      const prefix = isTilawah ? 'TLW' : 'THF';
      const driveFileName = prefix + "_" + cleanName + "_Juz" + selectedJuz + "_" + cleanSurah + "_Ayat" + start + "-" + end + ".webm";

      const newRecord = {
        id: "REC-" + prefix + "-" + Date.now().toString().slice(-4),
        category,
        studentId: confirmedStudent.id,
        studentName: confirmedStudent.name,
        kelas: confirmedStudent.kelas,
        juz: Number(selectedJuz),
        surahNumber: currentSurah.number,
        surahName: currentSurah.name,
        ayatStart: start,
        ayatEnd: end,
        nagham: isTilawah ? naghamStyle : undefined,
        duration: formatDuration(Math.max(1, recordingSeconds)),
        timestamp: timestampStr,
        driveFileId: driveFileName,
        driveUrl: isTilawah
          ? "https://drive.google.com/drive/folders/tilawah-audio"
          : "https://drive.google.com/drive/folders/tahfiz-audio",
        sheetStatus: "Terekap di Sheet_" + (isTilawah ? "Tilawah" : "Tahfiz"),
        audioUrl: recordedAudioUrl,
        grade: "",
        teacherName: "",
        teacherComment: "",
        parentComment: ""
      };

      onSaveRecord(newRecord);
      setIsUploading(false);
      setRecordedAudioUrl(null);
      setRecordingSeconds(0);
    }, 600);
  };

  const studentRecords = confirmedStudent
    ? records.filter(r => r.studentId === confirmedStudent.id)
    : records;

  return (
    <div className="space-y-6">
      <div
        style={{
          background: isTilawah
            ? 'linear-gradient(90deg, var(--accent-color), var(--primary-color))'
            : 'linear-gradient(90deg, var(--primary-color), var(--secondary-color))'
        }}
        className="rounded-2xl p-6 text-white shadow-md"
      >
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-black/25 text-white mb-2">
              {isTilawah ? <Music className="w-3.5 h-3.5" /> : <Mic className="w-3.5 h-3.5" />}
              <span>Halaman {pageNumber} • Portal Murid {schoolName}</span>
            </span>
            <h3 className="text-xl sm:text-2xl font-extrabold">{title}</h3>
            <p className="text-xs sm:text-sm text-white/90 mt-1">{subtitle}</p>
          </div>
          <div className="bg-black/20 backdrop-blur-xs rounded-xl px-4 py-3 border border-white/20 text-xs shrink-0">
            <div className="font-bold" style={{ color: 'var(--accent-color)' }}>Penyimpanan Otomatis:</div>
            <div className="flex items-center gap-1.5 mt-1">
              <FolderGit2 className="w-4 h-4" />
              <span>Google Drive Audio ({isTilawah ? 'Folder Tilawah' : 'Folder Tahfiz'})</span>
            </div>
            <div className="flex items-center gap-1.5 mt-0.5">
              <FileSpreadsheet className="w-4 h-4" />
              <span>Google Spreadsheet ({isTilawah ? 'Sheet_Tilawah' : 'Sheet_Tahfiz'})</span>
            </div>
          </div>
        </div>
      </div>

      {/* LANGKAH 1: PILIH NAMA MURID */}
      <div className="bg-white rounded-2xl shadow-xs border border-slate-200 p-5 sm:p-6">
        <h4 className="text-base font-bold text-slate-800 flex items-center gap-2 mb-4">
          <span
            style={{ backgroundColor: 'var(--primary-color)' }}
            className="w-6 h-6 rounded-full text-xs font-bold text-white flex items-center justify-center"
          >
            1
          </span>
          <span>Pilih Nama Murid & Tekan Tombol OK</span>
        </h4>

        <form onSubmit={handleConfirmStudent} className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
          <div className="sm:col-span-9">
            <label className="block text-xs font-semibold text-slate-600 mb-1">
              Daftar Nama Murid {schoolName} ({students.length} Murid):
            </label>
            <select
              value={selectedStudentId}
              onChange={(e) => setSelectedStudentId(e.target.value)}
              className="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm font-semibold text-slate-800 bg-slate-50 focus:outline-none"
            >
              {students.map((std, idx) => (
                <option key={std.id} value={std.id}>
                  {idx + 1}. {std.name} — Kelas {std.kelas}
                </option>
              ))}
            </select>
          </div>

          <div className="sm:col-span-3">
            <button
              type="submit"
              style={{ backgroundColor: 'var(--primary-color)' }}
              className="w-full py-2.5 px-5 rounded-xl font-bold text-sm text-white shadow-sm hover:opacity-95 transition cursor-pointer flex items-center justify-center gap-2"
            >
              <Check className="w-4 h-4" />
              <span>OK (Pilih Murid)</span>
            </button>
          </div>
        </form>

        {confirmedStudent && (
          <div className="mt-4 p-3.5 rounded-xl border bg-slate-50 border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div className="flex items-center gap-2">
              <User className="w-4 h-4 shrink-0" style={{ color: 'var(--primary-color)' }} />
              <span>
                Murid Aktif: <strong>{confirmedStudent.name}</strong> • Kelas: <strong>{confirmedStudent.kelas}</strong> • ID: <code className="font-mono">{confirmedStudent.id}</code>
              </span>
            </div>
            <span
              style={{ backgroundColor: 'var(--primary-color)' }}
              className="px-2.5 py-0.5 rounded-full font-bold text-white"
            >
              Siap Merekam {isTilawah ? 'Tilawah Mujawwad' : 'Hafalan Tahfiz'}
            </span>
          </div>
        )}
      </div>

      {/* LANGKAH 2: PILIH JUZ (1-30), SURAT, AYAT & NAGHAM BESERTA CABANGNYA */}
      <div className="bg-white rounded-2xl shadow-xs border border-slate-200 p-5 sm:p-6">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
          <h4 className="text-base font-bold text-slate-800 flex items-center gap-2">
            <span
              style={{ backgroundColor: 'var(--primary-color)' }}
              className="w-6 h-6 rounded-full text-xs font-bold text-white flex items-center justify-center"
            >
              2
            </span>
            <span>Pilih Juz (Juz 1 s/d Juz 30), Surat, Nomor Ayat {isTilawah ? '& Cabang Nagham Tilawah' : '& Mulai Perekaman'}</span>
          </h4>
          {!confirmedStudent && (
            <span className="text-xs font-semibold text-amber-700 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
              💡 Klik tombol "OK (Pilih Murid)" pada Langkah 1 terlebih dahulu
            </span>
          )}
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-6 space-y-4">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Pilih Juz Al-Qur'an (Juz 1 - 30):</label>
                <select
                  value={selectedJuz}
                  onChange={(e) => handleJuzChange(e.target.value)}
                  className="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm font-bold text-slate-800 bg-slate-50"
                >
                  {JUZ_MAPPING_30.map(j => (
                    <option key={j.juz} value={j.juz}>
                      {j.label}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Pilih Nama Surat (Juz {selectedJuz}):</label>
                <select
                  value={selectedSurahNum}
                  onChange={(e) => handleSurahChange(e.target.value)}
                  className="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm font-bold text-slate-800 bg-slate-50"
                >
                  {filteredSurahs.map(s => (
                    <option key={s.juz + "-" + s.number} value={s.number}>
                      {s.number}. QS. {s.name} (Ayat {s.juzAyatStart}-{s.juzAyatEnd} • Total {s.ayat} Ayat)
                    </option>
                  ))}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">
                  Mulai Nomor Ayat (1 - {currentSurah.ayat}):
                </label>
                <input
                  type="number"
                  min={1}
                  max={currentSurah.ayat}
                  value={ayatStart}
                  onChange={(e) => setAyatStart(e.target.value)}
                  className="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm font-bold text-slate-800 bg-slate-50"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">
                  Sampai Nomor Ayat (Maks {currentSurah.ayat}):
                </label>
                <input
                  type="number"
                  min={1}
                  max={currentSurah.ayat}
                  value={ayatEnd}
                  onChange={(e) => setAyatEnd(e.target.value)}
                  className="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm font-bold text-slate-800 bg-slate-50"
                />
              </div>
            </div>

            {isTilawah && (
              <div className="p-3.5 rounded-2xl bg-amber-50/90 border border-amber-300 space-y-3">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-amber-950 mb-1">
                      1. Pilih Jenis Maqam Nagham Utama:
                    </label>
                    <select
                      value={selectedMaqam}
                      onChange={(e) => handleMaqamChange(e.target.value)}
                      className="w-full rounded-xl border border-amber-300 px-3 py-2.5 text-sm font-bold text-slate-900 bg-white"
                    >
                      {NAGHAM_MAQAM_TREE.map(item => (
                        <option key={item.maqam} value={item.maqam}>
                          Maqam {item.maqam}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-amber-950 mb-1">
                      2. Pilih Cabang / Tingkatan Nada ({selectedMaqam}):
                    </label>
                    <select
                      value={selectedNaghamBranch}
                      onChange={(e) => setSelectedNaghamBranch(e.target.value)}
                      className="w-full rounded-xl border border-amber-300 px-3 py-2.5 text-sm font-bold text-slate-900 bg-white"
                    >
                      {currentMaqamObj.branches.map(branch => (
                        <option key={branch} value={branch}>
                          {branch}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>
                <div className="text-[11px] text-amber-900 flex flex-wrap items-center justify-between gap-1">
                  <span>🎵 Karakter: <em>{currentMaqamObj.desc}</em></span>
                  <span className="font-bold bg-amber-200/80 px-2 py-0.5 rounded text-amber-950">
                    Dipilih: {naghamStyle}
                  </span>
                </div>
              </div>
            )}

            <div className="p-3.5 rounded-xl bg-slate-100 border border-slate-200 text-xs space-y-1">
              <div className="font-bold text-slate-700">Ringkasan Target Setoran:</div>
              <div className="text-slate-600">
                Surat: <strong>QS. {currentSurah.name} ({currentSurah.arti})</strong> • Juz {selectedJuz} • Ayat <strong>{ayatStart} s/d {ayatEnd}</strong>
                {isTilawah && (
                  <span className="block mt-1 text-amber-800 font-semibold">
                    Nagham Tilawah: {naghamStyle}
                  </span>
                )}
              </div>
            </div>
          </div>

          {/* Studio Perekam Suara */}
          <div className="lg:col-span-6 flex flex-col justify-between bg-slate-900 text-white rounded-2xl p-5 border border-slate-800">
            <div className="flex items-center justify-between">
              <span className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                <Volume2 className="w-4 h-4" style={{ color: 'var(--accent-color)' }} />
                Studio Perekam {isTilawah ? 'Tilawah Mujawwad' : 'Tahfiz'}
              </span>
              <span className={"px-2.5 py-0.5 rounded-full text-xs font-mono font-bold " + (isRecording ? "bg-rose-600 text-white animate-pulse" : "bg-slate-800 text-emerald-300")}>
                {isRecording ? "● REC " + formatDuration(recordingSeconds) : formatDuration(recordingSeconds)}
              </span>
            </div>

            <div className="my-5 h-16 flex items-center justify-center gap-1.5 px-4 bg-slate-950/70 rounded-xl border border-slate-800">
              {waveBars.map((height, i) => (
                <div
                  key={i}
                  style={{
                    height: height + "%",
                    backgroundColor: isRecording ? 'var(--accent-color)' : '#334155'
                  }}
                  className="w-2 rounded-full transition-all duration-300"
                />
              ))}
            </div>

            <div className="space-y-3">
              {!isRecording ? (
                <button
                  type="button"
                  onClick={() => {
                    if (!confirmedStudent) {
                      const std = students.find(s => s.id === selectedStudentId);
                      setConfirmedStudent(std);
                    }
                    startRecording();
                  }}
                  style={{ backgroundColor: 'var(--primary-color)' }}
                  className="w-full py-3 px-4 rounded-xl font-bold text-sm text-white shadow-lg hover:opacity-95 transition cursor-pointer flex items-center justify-center gap-2"
                >
                  <Mic className="w-5 h-5" />
                  <span>Mulai Perekaman {isTilawah ? 'Tilawah Mujawwad' : 'Hafalan'}</span>
                </button>
              ) : (
                <button
                  type="button"
                  onClick={stopRecording}
                  className="w-full py-3 px-4 rounded-xl font-bold text-sm bg-rose-600 hover:bg-rose-500 text-white shadow-lg transition cursor-pointer flex items-center justify-center gap-2 animate-pulse"
                >
                  <Square className="w-5 h-5" />
                  <span>Hentikan Perekaman (Selesai)</span>
                </button>
              )}

              {recordedAudioUrl && (
                <div className="p-3.5 rounded-xl bg-slate-800/90 border border-slate-700 space-y-3">
                  <div className="text-xs font-semibold text-emerald-300 flex items-center justify-between">
                    <span>Preview Hasil Rekaman Suara:</span>
                    <span>Durasi: {formatDuration(Math.max(1, recordingSeconds))}</span>
                  </div>
                  <audio controls src={recordedAudioUrl} className="w-full h-9" />
                  <button
                    type="button"
                    disabled={isUploading}
                    onClick={handleSaveToDriveAndSheet}
                    style={{ backgroundColor: 'var(--accent-color)' }}
                    className="w-full py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm text-slate-950 shadow transition cursor-pointer flex items-center justify-center gap-2"
                  >
                    <Upload className="w-4 h-4" />
                    <span>
                      {isUploading
                        ? 'Menyimpan ke Google Drive & Spreadsheet...'
                        : 'Simpan Rekaman ke Google Drive & Rekap Spreadsheet'}
                    </span>
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>

      {/* TABEL RIWAYAT REKAMAN */}
      <div className="bg-white rounded-2xl shadow-xs border border-slate-200 p-5 sm:p-6">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
          <h4 className="text-base font-bold text-slate-800 flex items-center gap-2">
            <FileSpreadsheet className="w-5 h-5" style={{ color: 'var(--primary-color)' }} />
            <span>
              Data Rekaman {isTilawah ? 'Tilawah Mujawwad' : 'Tahfiz'} yang Tersimpan di Drive & Spreadsheet
              {confirmedStudent ? " (" + confirmedStudent.name + ")" : ""}
            </span>
          </h4>
          {confirmedStudent && (
            <button
              onClick={() => setConfirmedStudent(null)}
              style={{ color: 'var(--primary-color)' }}
              className="text-xs font-semibold hover:underline cursor-pointer"
            >
              Tampilkan Semua Murid ({records.length})
            </button>
          )}
        </div>

        <div className="overflow-x-auto">
          <table className="w-full text-left border-collapse text-xs">
            <thead>
              <tr className="bg-slate-100 text-slate-700 border-b border-slate-200">
                <th className="p-3 font-bold">Waktu</th>
                <th className="p-3 font-bold">Nama Murid</th>
                <th className="p-3 font-bold">Surat, Ayat {isTilawah ? '& Nagham' : ''}</th>
                <th className="p-3 font-bold">File Google Drive</th>
                <th className="p-3 font-bold">Putar Audio</th>
                <th className="p-3 font-bold">Status Spreadsheet</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-200">
              {studentRecords.map((rec) => (
                <tr key={rec.id} className="hover:bg-slate-50">
                  <td className="p-3 whitespace-nowrap text-slate-500">{rec.timestamp}</td>
                  <td className="p-3 font-bold text-slate-800">
                    {rec.studentName} <span className="text-slate-500 font-normal">({rec.kelas})</span>
                  </td>
                  <td className="p-3">
                    <span className="font-bold" style={{ color: 'var(--primary-color)' }}>Juz {rec.juz} • QS. {rec.surahName}</span>
                    <span className="block text-slate-500">Ayat {rec.ayatStart} s/d {rec.ayatEnd}</span>
                    {rec.nagham && (
                      <span className="inline-block mt-0.5 px-2 py-0.5 rounded bg-amber-100 text-amber-900 font-semibold text-[11px]">
                        🎵 {rec.nagham}
                      </span>
                    )}
                  </td>
                  <td className="p-3 font-mono text-[11px] text-slate-600">
                    <div className="flex items-center gap-1">
                      <FolderGit2 className="w-3.5 h-3.5 shrink-0" style={{ color: 'var(--accent-color)' }} />
                      <span className="truncate max-w-[200px]">{rec.driveFileId}</span>
                    </div>

          tsxCode = tsxCode.replace(
            "setRecords(prev => [newRecord, ...prev]);",
            "setRecords(prev => { const next = [newRecord, ...prev]; postToCloudFast({ action: 'ADD_SINGLE_RECORD', record: newRecord }, next); return next; });"
          );
          tsxCode = tsxCode.replace(
            `  const handleTeacherSave = (recordId, grade, teacherComment, teacherName) => {
    setRecords(prev => prev.map(rec => {
      if (rec.id === recordId) {
        return { ...rec, grade, teacherComment, teacherName };
      }
      return rec;
    }));`,
            `  const handleTeacherSave = (recordId, grade, teacherComment, teacherName) => {
    setRecords(prev => {
      let targetRec = null;
      const next = prev.map(rec => {
        if (rec.id === recordId) {
          targetRec = { ...rec, grade, teacherComment, teacherName };
          return targetRec;
        }
        return rec;
      });
      if (targetRec) postToCloudFast({ action: 'UPDATE_SINGLE_RECORD', record: targetRec }, next);
      return next;
    });`
          );
          tsxCode = tsxCode.replace(
            `  const handleParentSave = (recordId, parentComment) => {
    setRecords(prev => prev.map(rec => {
      if (rec.id === recordId) {
        return { ...rec, parentComment };
      }
      return rec;
    }));`,
            `  const handleParentSave = (recordId, parentComment) => {
    setRecords(prev => {
      let targetRec = null;
      const next = prev.map(rec => {
        if (rec.id === recordId) {
          targetRec = { ...rec, parentComment };
          return targetRec;
        }
        return rec;
      });
      if (targetRec) postToCloudFast({ action: 'UPDATE_SINGLE_RECORD', record: targetRec }, next);
      return next;
    });`
          );
          tsxCode = tsxCode.replace(
            "setRecords(prev => prev.filter(rec => rec.id !== recordId));",
            "setRecords(prev => { const next = prev.filter(rec => rec.id !== recordId); postToCloudFast({ action: 'DELETE_SINGLE_RECORD', recordId }, next); return next; });"
          );

          const oldStudentState = `  // State tambah murid baru
  const [newStudentName, setNewStudentName] = useState("");`;
          const newStudentState = `  // State tambah murid baru & Bulk Import Excel 1.000 Murid
  const [newStudentName, setNewStudentName] = useState("");
  const [bulkExcelText, setBulkExcelText] = useState("");
  const [showBulkModal, setShowBulkModal] = useState(false);

  const handleBulkImportStudents = (replaceExisting = false) => {
    const lines = bulkExcelText.split(/\\r?\\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) {
      showToast("Tempelkan data dari Excel terlebih dahulu!", "error");
      return;
    }
    const startPwd = Number(draftConfig.studentPasswordStart) || 123456;
    const baseIdx = replaceExisting ? 0 : draftConfig.students.length;
    const parsedStudents = lines.map((line, idx) => {
      const parts = line.includes("\\t") ? line.split("\\t") : (line.includes(";") ? line.split(";") : line.split(","));
      const name = (parts[0] || "").trim().replace(/^["']|["']$/g, "");
      const kelas = (parts[1] || "VII-A").trim().replace(/^["']|["']$/g, "");
      const customPwd = (parts[2] || "").trim().replace(/^["']|["']$/g, "");
      const num = baseIdx + idx + 1;
      return {
        id: "STD-" + String(num).padStart(3, '0') + "-" + Math.random().toString(36).slice(2, 5),
        name: name || ("Murid " + num),
        kelas: kelas || "VII-A",
        password: customPwd || String(startPwd + num - 1)
      };
    });
    setDraftConfig(prev => ({
      ...prev,
      students: replaceExisting ? parsedStudents : [...prev.students, ...parsedStudents]
    }));
    setBulkExcelText("");
    setShowBulkModal(false);
    showToast("Berhasil mengimpor " + parsedStudents.length + " murid sekaligus! Jangan lupa klik Simpan Pengaturan Admin.");
  };`;
          tsxCode = tsxCode.replace(oldStudentState, newStudentState);

          const targetRangeBox = `                  {/* Form Tambah Murid Baru */}`;
          const injectedBulkImporter = `                  {/* FITUR IMPORT MASSAL 1.000 MURID DARI EXCEL / DAPODIK */}
                  <div className="bg-amber-50 border-2 border-amber-300 p-4 rounded-2xl space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <div className="text-xs font-extrabold text-amber-950">⚡ Import Massal Ratusan / 1.000 Murid dari Microsoft Excel (Selesai 10 Detik)</div>
                        <div className="text-[11px] text-amber-800">
                          Salin (Copy) kolom <strong>Nama Murid</strong>, <strong>Kelas</strong>, dan <strong>Password/NISN (Opsional)</strong> langsung dari Excel, lalu tempelkan di sini.
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => setShowBulkModal(!showBulkModal)}
                        className="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold cursor-pointer shadow-xs"
                      >
                        {showBulkModal ? "Tutup Kotak Import Excel" : "📋 Buka Import Excel Massal"}
                      </button>
                    </div>

                    {showBulkModal && (
                      <div className="space-y-2.5 pt-2 border-t border-amber-200">
                        <textarea
                          rows={6}
                          value={bulkExcelText}
                          onChange={(e) => setBulkExcelText(e.target.value)}
                          placeholder={"Contoh hasil Copy-Paste dari Excel (atau pisahkan dengan koma):\\nAhmad Fauzan\\tVII-A\\t123456\\nAisyah Putri\\tVII-A\\t123457\\nBima Arya\\tVIII-B\\t123458"}
                          className="w-full rounded-xl border border-amber-300 p-3 text-xs font-mono bg-white text-slate-800"
                        />
                        <div className="flex flex-wrap gap-2 justify-end">
                          <button
                            type="button"
                            onClick={() => handleBulkImportStudents(false)}
                            className="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold cursor-pointer"
                          >
                            + Tambahkan ke Daftar Saat Ini
                          </button>
                          <button
                            type="button"
                            onClick={() => handleBulkImportStudents(true)}
                            className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold cursor-pointer"
                          >
                            🔄 Ganti Seluruh Daftar Murid Lama dengan Ini
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Form Tambah Murid Baru */}`;

          tsxCode = tsxCode.replace(targetRangeBox, injectedBulkImporter);

          const targetAdminPinInput = `                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">PIN Halaman Database:</label>
                        <input
                          type="text"
                          value={draftConfig.databasePin}
                          onChange={(e) => setDraftConfig(prev => ({ ...prev, databasePin: e.target.value }))}
                          className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-mono font-bold bg-slate-50"
                        />
                      </div>
                    </div>`;

          const injectedToggleSwitch = targetAdminPinInput + `
                    <div className="mt-4 p-4 rounded-2xl border-2 border-amber-300 bg-amber-50/80 flex items-center justify-between gap-4">
                      <div>
                        <div className="text-xs font-extrabold text-amber-950">🔒 Sembunyikan Bantuan & Tombol "Isi Password Otomatis" (Mode Sekolah Resmi)</div>
                        <div className="text-[11px] text-amber-800 mt-0.5">
                          Aktifkan saklar ini saat aplikasi sudah dipakai murid agar tombol "Password (123456-123490)" dan "Isi Otomatis" disembunyikan.
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => setDraftConfig(prev => ({ ...prev, hidePasswordHints: !prev.hidePasswordHints }))}
                        className={"px-3.5 py-2 rounded-xl text-xs font-extrabold shrink-0 cursor-pointer transition " + (draftConfig.hidePasswordHints ? "bg-slate-900 text-amber-400" : "bg-amber-500 text-slate-950")}
                      >
                        {draftConfig.hidePasswordHints ? '🔒 TERSEMBUNYI (MODE RESMI)' : '🔓 TAMPIL (MODE DEMO)'}
                      </button>
                    </div>`;

          tsxCode = tsxCode.replace(targetAdminPinInput, injectedToggleSwitch);

          tsxCode = tsxCode.replaceAll(
            'className="text-[11px] font-bold hover:underline cursor-pointer"',
            'className="text-[11px] font-bold hover:underline cursor-pointer demo-pwd-btn"'
          );
          tsxCode = tsxCode.replace(
            'onClick={() => setShowPasswordModal(true)}\n                className="flex items-center gap-1.5 px-3 py-2',
            'onClick={() => setShowPasswordModal(true)}\n                className="demo-pwd-btn flex items-center gap-1.5 px-3 py-2'
          );
          tsxCode = tsxCode.replace(
            'onClick={onOpenPasswordList}\n            style={{ color: \'var(--primary-color)\' }}\n            className="text-xs font-bold hover:underline cursor-pointer"',
            'onClick={onOpenPasswordList}\n            style={{ color: \'var(--primary-color)\' }}\n            className="demo-pwd-btn text-xs font-bold hover:underline cursor-pointer"'
          );

          const modifiedCode = tsxCode.replace('export default function App()', 'function App()') +
            '\nimport { createRoot } from "react-dom/client";\ncreateRoot(document.getElementById("root")).render(<App />);';

          compiledCode = Babel.transform(modifiedCode, {
            presets: [
              ['react', { runtime: 'classic' }],
              'typescript'
            ],
            sourceType: 'module',
            filename: 'app.tsx'
          }).code;

          try {
            sessionStorage.setItem(CACHE_KEY, compiledCode);
          } catch (e) {}
        }

        const blob = new Blob([compiledCode], { type: 'text/javascript' });
        const moduleUrl = URL.createObjectURL(blob);
        await import(moduleUrl);

      } catch (err) {
        document.getElementById('root').innerHTML = 
          '<div style="padding:24px;color:#be123c;font-family:monospace;background:#ffe4e6;margin:20px;border-radius:12px;">' +
          '<strong>Detail Kendala Teknis:</strong><br/>' + err.message + '</div>';
        console.error(err);
      }
    }

    bootRealtimeApp();
  </script>
</body>
</html>
